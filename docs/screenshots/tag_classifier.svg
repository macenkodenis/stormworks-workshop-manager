<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="modal-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="12" fill="url(#modal-bg)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>
  <rect width="800" height="46" rx="12" fill="#0b1120"/>
  <rect y="36" width="800" height="10" fill="#0b1120"/>
  <circle cx="24" cy="23" r="6" fill="#ef4444"/>
  <circle cx="44" cy="23" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="23" r="6" fill="#10b981"/>
  <text x="400" y="28" fill="#f8fafc" font-size="14" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">
    Auto-Classifier Rules &amp; Tag Manager
  </text>

  <!-- Content Box -->
  <rect x="40" y="70" width="720" height="370" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
  
  <text x="65" y="105" fill="#38bdf8" font-size="15" font-family="system-ui, sans-serif" font-weight="bold">Classification Rules</text>
  <text x="65" y="128" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">Automate tagging for all scanned Stormworks workshop vehicles and microcontrollers based on keywords.</text>

  <!-- Rule 1 -->
  <rect x="65" y="150" width="670" height="60" rx="6" fill="#1f2937" stroke="#4b5563" stroke-width="1"/>
  <text x="85" y="175" fill="#f3f4f6" font-size="13" font-family="system-ui, sans-serif" font-weight="600">Rule #1: Aircraft Identification</text>
  <text x="85" y="195" fill="#9ca3af" font-size="12" font-family="system-ui, sans-serif">If title or description contains: <tspan fill="#38bdf8">"plane", "jet", "cessna", "boeing"</tspan> → Add Tag: <tspan fill="#34d399">Aircraft &gt; Airplane</tspan></text>

  <!-- Rule 2 -->
  <rect x="65" y="225" width="670" height="60" rx="6" fill="#1f2937" stroke="#4b5563" stroke-width="1"/>
  <text x="85" y="250" fill="#f3f4f6" font-size="13" font-family="system-ui, sans-serif" font-weight="600">Rule #2: Microcontroller Auto-Tag</text>
  <text x="85" y="270" fill="#9ca3af" font-size="12" font-family="system-ui, sans-serif">If Steam Tag equals: <tspan fill="#38bdf8">"Microcontroller"</tspan> and title has <tspan fill="#38bdf8">"ECU"</tspan> → Add Tag: <tspan fill="#a78bfa">Logic &gt; Engine Controller</tspan></text>

  <!-- Rule 3 -->
  <rect x="65" y="300" width="670" height="60" rx="6" fill="#1f2937" stroke="#4b5563" stroke-width="1"/>
  <text x="85" y="325" fill="#f3f4f6" font-size="13" font-family="system-ui, sans-serif" font-weight="600">Rule #3: Search &amp; Rescue Role</text>
  <text x="85" y="345" fill="#9ca3af" font-size="12" font-family="system-ui, sans-serif">If description contains: <tspan fill="#38bdf8">"SAR", "coast guard", "hospital", "stretcher"</tspan> → Add Tag: <tspan fill="#f87171">Missions &gt; Rescue</tspan></text>

  <!-- Action Buttons -->
  <rect x="520" y="385" width="105" height="34" rx="6" fill="#374151"/>
  <text x="572" y="407" fill="#f3f4f6" font-size="13" font-family="system-ui, sans-serif" text-anchor="middle">+ Add Rule</text>

  <rect x="635" y="385" width="100" height="34" rx="6" fill="#0284c7"/>
  <text x="685" y="407" fill="#ffffff" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">⚡ Run All</text>
</svg>
