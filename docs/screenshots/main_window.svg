<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" rx="12" fill="url(#bg)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Window Header -->
  <rect width="1000" height="42" rx="12" fill="#0b1120"/>
  <rect y="30" width="1000" height="12" fill="#0b1120"/>
  <circle cx="24" cy="21" r="6" fill="#ef4444"/>
  <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="21" r="6" fill="#10b981"/>
  <text x="500" y="26" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">
    Stormworks Steam Workshop Manager — v0.1.0-beta.1 (Desktop)
  </text>

  <!-- Navigation Bar -->
  <rect y="42" width="1000" height="56" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <!-- Search input -->
  <rect x="240" y="52" width="420" height="36" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="260" y="75" fill="#64748b" font-size="13" font-family="system-ui, sans-serif">🔍 Search titles, tags, authors, IDs...</text>
  <!-- Quick action buttons -->
  <rect x="680" y="52" width="120" height="36" rx="8" fill="#0284c7"/>
  <text x="740" y="75" fill="#ffffff" font-size="13" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">🔄 Scan Workshop</text>
  <rect x="815" y="52" width="160" height="36" rx="8" fill="#334155"/>
  <text x="895" y="75" fill="#e2e8f0" font-size="13" font-family="system-ui, sans-serif" text-anchor="middle">📁 Sync save.xml</text>

  <!-- Left Sidebar (Tags / Categories) -->
  <rect x="0" y="98" width="220" height="462" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="20" y="130" fill="#38bdf8" font-size="12" font-family="system-ui, sans-serif" font-weight="700" letter-spacing="1">CATEGORIES &amp; TAGS</text>

  <rect x="12" y="145" width="196" height="30" rx="6" fill="#1e293b"/>
  <text x="24" y="165" fill="#f8fafc" font-size="13" font-family="system-ui, sans-serif">📦 All Items (438)</text>

  <text x="24" y="202" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">✈️ Aircraft (112)</text>
  <text x="40" y="228" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">└ Airplanes (64)</text>
  <text x="40" y="252" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">└ Helicopters (38)</text>
  <text x="24" y="285" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">🚢 Maritime (145)</text>
  <text x="24" y="318" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">🚗 Land Vehicles (84)</text>
  <text x="24" y="351" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">⚡ Microcontrollers (97)</text>

  <!-- Grid Area (Mod Cards) -->
  <!-- Card 1 -->
  <g transform="translate(240, 115)">
    <rect width="230" height="200" rx="10" fill="url(#card-grad)" stroke="#475569" stroke-width="1"/>
    <rect width="230" height="110" rx="10" fill="#0284c7" fill-opacity="0.2"/>
    <text x="115" y="65" fill="#38bdf8" font-size="14" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">[Workshop Preview]</text>
    <text x="14" y="135" fill="#f8fafc" font-size="13" font-family="system-ui, sans-serif" font-weight="bold">SAR Coast Guard Cutter</text>
    <text x="14" y="155" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Author: CaptainStorm</text>
    <rect x="14" y="168" width="60" height="20" rx="4" fill="#0369a1"/>
    <text x="44" y="182" fill="#e0f2fe" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Boat</text>
    <rect x="80" y="168" width="60" height="20" rx="4" fill="#065f46"/>
    <text x="110" y="182" fill="#a7f3d0" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Rescue</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(485, 115)">
    <rect width="230" height="200" rx="10" fill="url(#card-grad)" stroke="#475569" stroke-width="1"/>
    <rect width="230" height="110" rx="10" fill="#0284c7" fill-opacity="0.2"/>
    <text x="115" y="65" fill="#38bdf8" font-size="14" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">[Workshop Preview]</text>
    <text x="14" y="135" fill="#f8fafc" font-size="13" font-family="system-ui, sans-serif" font-weight="bold">Advanced Modular ECU v3</text>
    <text x="14" y="155" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Author: LogicMaster</text>
    <rect x="14" y="168" width="85" height="20" rx="4" fill="#4338ca"/>
    <text x="56" y="182" fill="#e0e7ff" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Microcontroller</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(730, 115)">
    <rect width="230" height="200" rx="10" fill="url(#card-grad)" stroke="#475569" stroke-width="1"/>
    <rect width="230" height="110" rx="10" fill="#0284c7" fill-opacity="0.2"/>
    <text x="115" y="65" fill="#38bdf8" font-size="14" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">[Workshop Preview]</text>
    <text x="14" y="135" fill="#f8fafc" font-size="13" font-family="system-ui, sans-serif" font-weight="bold">Heavy Cargo VTOL-80</text>
    <text x="14" y="155" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Author: SkyEngineer</text>
    <rect x="14" y="168" width="55" height="20" rx="4" fill="#92400e"/>
    <text x="41" y="182" fill="#fef3c7" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Aircraft</text>
    <rect x="75" y="168" width="45" height="20" rx="4" fill="#0369a1"/>
    <text x="97" y="182" fill="#e0f2fe" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">VTOL</text>
  </g>

  <!-- Card 4 (Second row) -->
  <g transform="translate(240, 335)">
    <rect width="230" height="200" rx="10" fill="url(#card-grad)" stroke="#475569" stroke-width="1"/>
    <rect width="230" height="110" rx="10" fill="#0284c7" fill-opacity="0.2"/>
    <text x="115" y="65" fill="#38bdf8" font-size="14" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">[Workshop Preview]</text>
    <text x="14" y="135" fill="#f8fafc" font-size="13" font-family="system-ui, sans-serif" font-weight="bold">Deep Ocean Explorer Sub</text>
    <text x="14" y="155" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Author: NauticalSub</text>
  </g>

  <!-- Card 5 (Second row) -->
  <g transform="translate(485, 335)">
    <rect width="230" height="200" rx="10" fill="url(#card-grad)" stroke="#475569" stroke-width="1"/>
    <rect width="230" height="110" rx="10" fill="#0284c7" fill-opacity="0.2"/>
    <text x="115" y="65" fill="#38bdf8" font-size="14" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">[Workshop Preview]</text>
    <text x="14" y="135" fill="#f8fafc" font-size="13" font-family="system-ui, sans-serif" font-weight="bold">8x8 Arctic Heavy Truck</text>
    <text x="14" y="155" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Author: HeavyHauler</text>
  </g>

  <!-- Card 6 (Second row) -->
  <g transform="translate(730, 335)">
    <rect width="230" height="200" rx="10" fill="url(#card-grad)" stroke="#475569" stroke-width="1"/>
    <rect width="230" height="110" rx="10" fill="#0284c7" fill-opacity="0.2"/>
    <text x="115" y="65" fill="#38bdf8" font-size="14" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">[Workshop Preview]</text>
    <text x="14" y="135" fill="#f8fafc" font-size="13" font-family="system-ui, sans-serif" font-weight="bold">Sonar Tracking System</text>
    <text x="14" y="155" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Author: WaveRider</text>
  </g>

</svg>
