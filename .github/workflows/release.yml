name: Build & Release

on:
  push:
    branches:
      - test-windows
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Assets
        run: |
          cd frontend
          npm install
          npm run build
          cd ..

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Package Applications with PyInstaller (Slim, Server, and Linux Standalone)
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            pyinstaller --clean --noconfirm desktop/desktop.spec
          fi
          pyinstaller --clean --noconfirm desktop/desktop_slim.spec
          pyinstaller --clean --noconfirm desktop/server.spec

      - name: Archive Linux Bundles
        if: runner.os == 'Linux'
        run: |
          tar -czvf StormworksWorkshopManager-Linux-Standalone-x86_64.tar.gz -C dist StormworksWorkshopManager
          tar -czvf StormworksWorkshopManager-Linux-Slim-x86_64.tar.gz -C dist StormworksWorkshopManager-Slim
          tar -czvf StormworksWorkshopManager-Server-Linux-x86_64.tar.gz -C dist StormworksWorkshopManager-Server

      - name: Archive Windows Bundles
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/StormworksWorkshopManager-Slim -DestinationPath StormworksWorkshopManager-Windows-Slim-x64.zip
          Compress-Archive -Path dist/StormworksWorkshopManager-Server -DestinationPath StormworksWorkshopManager-Server-Windows-x64.zip

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifacts
          path: |
            StormworksWorkshopManager-*.tar.gz
            StormworksWorkshopManager-*.zip

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine if Pre-release
        id: check_prerelease
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ "$TAG_NAME" == *"-beta"* || "$TAG_NAME" == *"-alpha"* || "$TAG_NAME" == *"-rc"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Stormworks Workshop Manager ${{ github.ref_name }}
          draft: false
          prerelease: ${{ steps.check_prerelease.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-assets/*
            presets/starter_tags_pack.swtags.json
